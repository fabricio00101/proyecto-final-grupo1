{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>{% if object %}Editar{% else %}Nuevo{% endif %} Post</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'posts:listar_posts' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
