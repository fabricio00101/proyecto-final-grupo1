{% extends 'base.html' %}

{% block contenido %}
<div class="container mt-4">
    <h2>Eliminar Publicación</h2>
    <p>¿Estás seguro de que deseas eliminar la publicación "{{ object.titulo }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'publicaciones:listar' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
