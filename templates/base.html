{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %} Blog Grupo 1 {% endblock %}</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

    <header class="main-nav">
        <div class="container">
            <a href="{% url 'index' %}" class="logo">Realidad Virtual</a>
            <nav>
                <ul class="nav-links">
                    <li><a href="{% url 'index' %}">Inicio</a></li>
                    <li><a href="{% url 'posts:listar_posts' %}">Publicaciones</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block contenido %}
        {% endblock %}
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2025 Proyecto Final - Grupo 1</p>
            <small>Desarrollado con Django</small>
        </div>
    </footer>

</body>
</html>
