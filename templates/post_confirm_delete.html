{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Eliminar Post</h2>
    <p>¿Estás seguro de que deseas eliminar el post "{{ object.titulo }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'posts:listar_posts' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
